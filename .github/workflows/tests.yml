name: Run Tests

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testing_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_NAME: testing_db
      DB_USER: root
      DB_PASSWORD: root
      DB_CHARSET: utf8mb4
      TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=testing_db;charset=utf8mb4

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, sqlite3, mbstring, gd, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate project metadata and JavaScript syntax
        run: |
          composer validate --no-check-publish
          node --check js/common.js
          node --check js/i18n.js
          node tests/js/common-security.test.js

      - name: Validate PHP syntax
        run: git ls-files -z -- '*.php' | xargs -0 -n1 php -l

      - name: Migrate and seed MariaDB
        run: |
          vendor/bin/phinx migrate -e testing
          vendor/bin/phinx seed:run -e testing -s DefaultSeeder
          vendor/bin/phinx seed:run -e testing -s TestFixtureSeeder

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml
